# Continuous integration (STAGE28.md / reports/REPORT28.md).
#
# Runs the same checks this project has always run by hand at the end
# of every stage -- go build/vet/gofmt/test, cargo fmt/clippy/build/test
# -- automatically, on GitHub's own servers, every time anything is
# pushed to this repository or a pull request is opened against it.
# See reports/REPORT28.md for a full explanation of where this
# actually runs, what it costs, and how you find out about a failure.
name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go (build, vet, gofmt, test -race)
    runs-on: ubuntu-latest
    # A generous but finite ceiling: without this, a hung job (e.g. a
    # future concurrency bug that deadlocks instead of failing fast)
    # would otherwise be allowed to run for up to GitHub's own default
    # of 6 hours before being killed, silently burning through the
    # account's included Actions minutes the whole time.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go_src
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Reads the "go 1.26.5" directive straight out of go_src/go.mod,
          # so this workflow never needs updating by hand when that
          # changes.
          go-version-file: go_src/go.mod
          # go_src has no external dependencies (PROMPT.md's Go
          # constraint) and so no go.sum for setup-go's built-in
          # dependency cache to key off of; caching would be a no-op
          # here, so it's turned off rather than left to print a
          # harmless-but-noisy warning on every run.
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (with the race detector)
        run: go test -race ./...

  rust:
    name: Rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust_src
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      # rust_src does depend on a handful of ordinary crates (clap,
      # rand, crossbeam-deque, arc-swap -- see PROMPT.md's "crates are
      # inevitable" note), so, unlike Go above, there's real compiled
      # output worth reusing between runs. Keyed on Cargo.lock's
      # contents: any dependency-version change gets a fresh cache
      # automatically.
      - name: Cache the cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_src/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust_src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting (cargo fmt)
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Test (release)
        run: cargo test --release

  smoke:
    # STAGE37.md / reports/REPORT37.md: real end-to-end confirmation
    # that a change hasn't silently broken something the unit tests
    # above never actually exercise -- neither job above ever invokes
    # the built binary itself, so an argument-parsing regression or a
    # build that compiles but panics on real input would sail through
    # both. This runs a small, curated set of --algorithm/--num-threads/
    # --no-preprocessing/--alg-params combinations (STAGE37.md's own
    # coverage table: every individual value at least once, not a full
    # cross product) against a couple of tiny benchmark/ files, through
    # util/benchcompare -- which was already built for exactly this
    # (both languages, real CLI invocations, and independent solution
    # verification; see its own README.md) -- with --fail-on-issues so
    # this job actually fails the build on a crash, a wrong verdict, or
    # a cross-language disagreement, not just print a report nobody
    # reads.
    name: Smoke test (both binaries, curated CLI combinations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Waits on the two jobs above rather than running in parallel with
    # them: if the basic build/vet/test already fails, there is no
    # point spending more Actions minutes building both binaries again
    # just to smoke-test something already known to be broken.
    needs: [go, rust]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: util/benchcompare/go.mod
          cache: false

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Cache the cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_src/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust_src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build the Go binary
        working-directory: go_src
        run: go build -o /tmp/vibe_sat_go ./cmd/vibe_sat

      - name: Build the Rust binary (release)
        working-directory: rust_src
        run: cargo build --release

      - name: Run curated smoke-test combinations
        working-directory: util/benchcompare
        run: |
          GO_BIN=/tmp/vibe_sat_go
          RUST_BIN="$GITHUB_WORKSPACE/rust_src/target/release/vibe_sat"
          COMMON="--go-bin=$GO_BIN --rust-bin=$RUST_BIN --fail-on-issues --sample=1 --seed=1"

          # uf20-91 is SATLIB's own guaranteed-satisfiable set (20
          # variables); uuf50-218 is its guaranteed-unsatisfiable
          # counterpart (50 variables) -- both tiny enough that every
          # row below is expected to finish in well under a second per
          # binary, regardless of which --sample=1/--seed=1 file gets
          # picked. hc/ws get a generously large restart/try count
          # (STAGE37.md: "large number of starts to virtually guarantee
          # success") rather than a --time-limit-secs, since a fixed
          # count is deterministic and hardware-independent; dfs/cdcl
          # need neither (they're complete, and these files are trivial
          # for them either way).
          go run . $COMMON --dirs=uf20-91   --algorithm=hc   --alg-params="5000"
          go run . $COMMON --dirs=uf20-91   --algorithm=ws   --alg-params="1000" --num-threads=2
          go run . $COMMON --dirs=uf20-91   --algorithm=dfs  --alg-params="0"
          go run . $COMMON --dirs=uuf50-218 --algorithm=dfs  --alg-params="1" --no-preprocessing --num-threads=3
          go run . $COMMON --dirs=uf20-91   --algorithm=cdcl --alg-params="0 0"
          go run . $COMMON --dirs=uuf50-218 --algorithm=cdcl --alg-params="1 1" --no-preprocessing --num-threads=4
          go run . $COMMON --dirs=uf20-91   --algorithm=cdcl --alg-params="2 2"
          go run . $COMMON --dirs=uuf50-218 --algorithm=cdcl --alg-params="3 3" --num-threads=2
          go run . $COMMON --dirs=uf20-91   --algorithm=cdcl --alg-params="2 4" --num-threads=3
          go run . $COMMON --dirs=uuf50-218 --algorithm=cdcl --alg-params="2 5"
